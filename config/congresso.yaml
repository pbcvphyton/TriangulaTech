    nome: "Economia, tributos e orçamento"
    curto: "Economia"
    camara: [40, 70, 66, 67, 60]
    senado: ["Economia e Desenvolvimento", "Orçamento Público", "Jurídico / Direito do Consumidor", "Jurídico / Direito Empresarial e Econômico"]
  - id: trabalho
    nome: "Trabalho e previdência"
    curto: "Trabalho"
    camara: [58, 52]
    senado: ["Política Social / Trabalho e Emprego", "Política Social / Previdência Social"]
  - id: saude
    nome: "Saúde"
    curto: "Saúde"
    camara: [56]
    senado: ["Política Social / Saúde"]
  - id: educacao
    nome: "Educação, cultura e esporte"
    curto: "Educação"
    camara: [46, 35, 39, 86]
    senado: ["Política Social / Educação", "Política Social / Cultura", "Política Social / Desporto e Lazer"]
  - id: seguranca
    nome: "Segurança e justiça penal"
    curto: "Segurança"
    camara: [43, 57]
    senado: ["Jurídico / Direito Penal e Penitenciário", "Soberania, Defesa Nacional e Ordem Pública / Defesa do Estado e das Instituições Democráticas"]
  - id: direitos
    nome: "Direitos humanos e proteção social"
    curto: "Direitos humanos"
    camara: [44]
    senado: ["Política Social / Proteção Social", "Jurídico / Direitos e Garantias", "Política Social"]
  - id: ambiente
    nome: "Meio ambiente e energia"
    curto: "Meio ambiente"
    camara: [48, 54, 85]
    senado: ["Meio Ambiente", "Infraestrutura / Minas e Energia"]
  - id: agro
    nome: "Agro e terra"
    curto: "Agro"
    camara: [64, 51]
    senado: ["Economia e Desenvolvimento / Agropecuária e Abastecimento", "Economia e Desenvolvimento / Política Fundiária e Reforma Agrária"]
  - id: cidades
    nome: "Cidades, transporte e infraestrutura"
    curto: "Cidades"
    camara: [41, 61]
    senado: ["Infraestrutura", "Política Social / Habitação", "Política Social / Desenvolvimento Urbano", "Jurídico / Direito de Trânsito"]
  - id: politica
    nome: "Política, Estado e Justiça"
    curto: "Política"
    camara: [34, 53, 68, 74, 76, 42]
    senado: ["Administração Pública", "Organização do Estado", "Jurídico"]
  - id: exterior
    nome: "Relações exteriores e defesa"
    curto: "Relações exteriores"
    camara: [55]
    senado: ["Soberania, Defesa Nacional e Ordem Pública"]
  - id: tecnologia
    nome: "Ciência, tecnologia e comunicações"
    curto: "Ciência e tecnologia"
    camara: [62, 37]
    senado: ["Economia e Desenvolvimento / Ciência, Tecnologia e Informática", "Infraestrutura / Comunicações"]
  - id: homenagens
    nome: "Homenagens e datas"
    curto: "Homenagens"
    camara: [72]
    senado: ["Honorífico"]

# Índice de relevância (0 a 100) das matérias prontas para o Plenário e das aprovadas
# nos últimos 12 meses: sinais de relevância pública que dá para medir nos registros
# oficiais. NÃO diz se a matéria é boa ou ruim; diz quantos sinais ela tem. Cada nota
# aparece decomposta na página, e os pesos são escolha editorial.
relevancia:
  pesos:
    demanda: 40       # projetos parecidos anexados a ela (outros parlamentares pedindo o mesmo)
    origem: 25        # de onde veio: já aprovada na outra Casa, do Executivo, de comissão...
    alcance: 20       # o tipo de norma: PEC > lei complementar > lei
    apoio: 15         # autores de partidos diferentes (e dos dois polos)
  janela_demanda_anos: 0    # 0: contam todos os projetos parecidos anexados; N: só os apresentados nos N anos antes
  demanda_cheia: 15         # 15 projetos parecidos na janela dão a nota cheia (escala logarítmica)
  origem:                   # parte do peso de "origem" que cada origem recebe
    outra_casa: 1.0         # já aprovada pela outra Casa
    popular: 1.0            # iniciativa popular ou sugestão da sociedade
    executivo: 0.8
    comissao: 0.7           # comissões, CPIs e comissões mistas
    judiciario: 0.6         # tribunais, Ministério Público, Tribunal de Contas, Defensoria
    parlamentar: 0.0
  alcance: {PEC: 1.0, PLP: 0.8, PL: 0.6, PLS: 0.6, PLC: 0.6, PDL: 0.3}
  simbolica_teto: 10        # matéria simbólica (dia nacional, denominação, título) não passa disto
  alta: 60                  # a partir daqui, sinais fortes
  baixa: 30                 # abaixo daqui, sinais fracos

# Apelidos de projetos, como o noticiário os chama: servem para achar o projeto quando o
# jornal não cita o número, e aparecem ao lado do número na página (o primeiro da lista).
# Cada um foi conferido contra a ementa oficial. Apelido que vale para mais de um projeto
# (como "reforma tributária" ou "PL da Anistia") fica de fora.
apelidos:
  "PL 2630/2020": ["PL das Fake News", "PL da Censura"]
  "PLP 93/2023": ["arcabouço fiscal"]
  "PEC 3/2021": ["PEC da Blindagem", "PEC das Prerrogativas"]
  "PL 1904/2024": ["PL do Aborto", "PL do Estupro"]
  "PL 2159/2021": ["PL do Licenciamento Ambiental", "PL da Devastação", "Lei Geral do Licenciamento"]
  "PL 914/2024": ["taxa das blusinhas", "taxação das blusinhas"]
  "PEC 18/2025": ["PEC da Segurança Pública"]
  "PEC 221/2019": ["PEC da escala 6x1", "escala 6x1"]
  "PL 5582/2025": ["PL Antifacção", "Lei Antifacção"]
  "PL 2162/2023": ["PL da Dosimetria", "Lei da Dosimetria"]
  "PEC 45/2023": ["PEC das Drogas"]
  "PL 2338/2023": ["PL da Inteligência Artificial", "PL da IA"]
  "MPV 1303/2025": ["MP do IOF"]

# Frentes parlamentares de causa: quem assina cada uma e como vota no tema dela. Só a Câmara
# registra quem assina (o Senado não publica as frentes). "titulo": o começo do título
# oficial (vale para qualquer legislatura em que a frente for registrada de novo com o mesmo
# nome; se dois registros casarem, vale o de mais membros); "nome": como aparece na página;
# "tema": o tema da aba em que a causa se vota ("todas": a frente não tem um tema só, e conta
# todas as votações esquerda × direita). A frente não registra posição: a página compara o
# voto de cada membro com o do coordenador, que é quem a registra. Assinar é barato: na
# legislatura 57, um deputado assina, na mediana, 109 das 320 frentes. A lista tem as duas
# pontas de cada tema, para não escolher lado.
