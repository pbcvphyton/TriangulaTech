  - {titulo: "Frente Parlamentar Mista em Defesa da Escola Pública", nome: "Escola Pública", tema: educacao}
  - {titulo: "Frente Parlamentar em Defesa da Educação Sem Doutrinação", nome: "Educação Sem Doutrinação", tema: educacao}
  - {titulo: "Frente Parlamentar da Segurança Pública", nome: "Segurança Pública", tema: seguranca}
  - {titulo: "Frente Parlamentar Mista de Proteção aos Colecionadores, Atiradores", nome: "Colecionadores, Atiradores e Caçadores (CACs)", tema: seguranca}
  - {titulo: "Frente Parlamentar Mista por Cidadania e Direitos LGBTI", nome: "Direitos LGBTI+", tema: direitos}
  - {titulo: "Frente Parlamentar Mista em Defesa dos Direitos dos Povos Indígenas", nome: "Povos Indígenas", tema: direitos}
  - {titulo: "Frente Parlamentar Mista Brasil-África com participação Popular de Enfrentamento ao Racismo", nome: "Enfrentamento ao Racismo", tema: direitos}
  - {titulo: "Frente Parlamentar Mista contra o Aborto", nome: "Contra o Aborto e em Defesa da Vida", tema: direitos}
  - {titulo: "Frente Parlamentar em Defesa da Vida e da Família", nome: "Vida e Família", tema: direitos}
  - {titulo: "Frente Parlamentar Mista Ambientalista", nome: "Ambientalista", tema: ambiente}
  - {titulo: "Frente Parlamentar Mista em Defesa da Transição Climática Justa", nome: "Transição Climática Justa", tema: ambiente}
  - {titulo: "Frente Parlamentar em Apoio ao Petróleo, Gás e Energia", nome: "Petróleo, Gás e Energia", tema: ambiente}
  - {titulo: "Frente Parlamentar Mista em Defesa da Exploração de Petróleo na Margem Equatorial", nome: "Petróleo na Margem Equatorial", tema: ambiente}
  - {titulo: "Frente Parlamentar da Agropecuária", nome: "Agropecuária (FPA)", tema: agro}
  - {titulo: "Frente Parlamentar Mista da Agricultura Familiar", nome: "Agricultura Familiar", tema: agro}
  - {titulo: "Frente Parlamentar pelo Desenvolvimento da Agroecologia", nome: "Agroecologia", tema: agro}
