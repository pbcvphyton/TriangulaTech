# Analítico do Congresso (aba "Congresso" e fichas nas matérias): as escolhas
# editoriais que as contas usam. Tudo aqui é opinável e fica à vista na seção
# "Como ler" da aba; mudar um valor muda a conta na atualização seguinte.

# Legislaturas cobertas. As votações nominais de cada ano ficam em
# data/congresso/base/ (os anos fechados nunca são refeitos).
legislaturas:
  - {numero: 56, inicio: "2019-02-01", fim: "2023-01-31"}
  - {numero: 57, inicio: "2023-02-01", fim: "2027-01-31"}

# Governos: quem a liderança "Governo" representa em cada período. O governismo de
# um parlamentar é contado separadamente em cada governo (quem vota com qualquer
# governo aparece assim). O dono revisa a cada eleição; sem "fim", vale até hoje.
governos:
  - {nome: "Bolsonaro", inicio: "2019-01-01", fim: "2022-12-31"}
  - {nome: "Lula", inicio: "2023-01-01"}

# Polos: as bancadas que definem os dois lados da conta "com quem vota". Entram só
# as votações em que a maioria de um polo votou Sim e a do outro, Não (ou vice-versa).
# "esquerda" e "direita" aqui são rótulos de comportamento: quem vota com o PT e
# quem vota com o PL quando os dois discordam.
polos:
  - inicio: "2019-02-01"
    fim: "2021-12-31"
    esquerda: [PT, PSOL, PCdoB]
    direita: [PSL, NOVO]          # o PSL era o partido do presidente; fundiu-se no UNIÃO em 2022
  - inicio: "2022-01-01"
    esquerda: [PT, PSOL, PCdoB]
    direita: [PL, NOVO]

# Limiares das contas (o que entra e o que vira afirmação).
limiares:
  coesao_polo: 0.75         # parte do polo do mesmo lado para a votação contar
  minimo_polo: 3            # votos Sim/Não do polo na votação
  minimo_divisivas: 10      # votações divisivas para dar o "campo" de alguém
  coesao_partido: 0.8       # partido "fechado": a partir daqui, votar diferente é dissidência
  minimo_partido: 4         # votos Sim/Não do partido na votação para ele ter posição
  minimo_presenca: 20       # votações no exercício para mostrar a presença
  dias_parado: 365          # projeto sem andamento há mais que isso está "parado"
  dias_relatoria: 180       # relatoria sem parecer há mais que isso entra em "sentado em cima"
  escolha_fidelidade: 80    # atalho "vota diferente do partido": votou com a maioria do partido em menos que isto (%)
  escolha_presenca: 60      # atalho "votou em menos de X% das votações" (%)
  frente_poucas: 20         # votações do tema abaixo disto: o cartão da frente avisa que são poucas
  placar_tolerancia: 20     # votação em que os votos um a um diferem do placar que a Mesa anunciou por mais que isto (no Sim ou no Não) fica fora das contas
  voto_apertado: 30         # realce "diferença pequena": menos que isto entre o Sim e o Não, na Câmara (no Senado, a mesma proporção das cadeiras: 5)

# Faixas do "campo" (pelo saldo: −100 = sempre com a esquerda, +100 = sempre com a
# direita). Os ids são os do Termômetro de Viés; os nomes dizem comportamento ("vota
# com…"), não identidade: um partido que se diz de direita pode cair em "mais com a
# esquerda", e é isso que a página mostra.
campos:
  - {id: esquerda, nome: "com a esquerda", ate: -60}
  - {id: centro_esquerda, nome: "mais com a esquerda", ate: -20}
  - {id: centro, nome: "dividido", ate: 20}
  - {id: centro_direita, nome: "mais com a direita", ate: 60}
  - {id: direita, nome: "com a direita", ate: 100}

# Macrotemas ("curto": o nome nas listas e nos filtros): as 32 áreas temáticas da Câmara (códigos de /referencias/proposicoes/codTema)
