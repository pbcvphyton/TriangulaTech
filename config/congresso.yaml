  - {titulo: "Frente Parlamentar do Sistema Único de Saúde", nome: "SUS", tema: saude}
  - {titulo: "Frente Parlamentar Mista em Defesa da Reforma Psiquiátrica", nome: "Reforma Psiquiátrica e Luta Antimanicomial", tema: saude}
  - {titulo: "Frente Parlamentar em Defesa das Comunidades Terapêuticas", nome: "Comunidades Terapêuticas", tema: saude}
