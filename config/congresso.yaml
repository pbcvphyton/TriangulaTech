# No Senado vale o prefixo mais longo.
temas:
  - id: economia
    nome: "Economia, tributos e orçamento"
    curto: "Economia"
    camara: [40, 70, 66, 67, 60]
    senado: ["Economia e Desenvolvimento", "Orçamento Público", "Jurídico / Direito do Consumidor", "Jurídico / Direito Empresarial e Econômico"]
  - id: trabalho
    nome: "Trabalho e previdência"
    curto: "Trabalho"
    camara: [58, 52]
    senado: ["Política Social / Trabalho e Emprego", "Política Social / Previdência Social"]
  - id: saude
    nome: "Saúde"
    curto: "Saúde"
    camara: [56]
    senado: ["Política Social / Saúde"]
  - id: educacao
    nome: "Educação, cultura e esporte"
    curto: "Educação"
    camara: [46, 35, 39, 86]
    senado: ["Política Social / Educação", "Política Social / Cultura", "Política Social / Desporto e Lazer"]
  - id: seguranca
    nome: "Segurança e justiça penal"
    curto: "Segurança"
    camara: [43, 57]
    senado: ["Jurídico / Direito Penal e Penitenciário", "Soberania, Defesa Nacional e Ordem Pública / Defesa do Estado e das Instituições Democráticas"]
  - id: direitos
    nome: "Direitos humanos e proteção social"
    curto: "Direitos humanos"
    camara: [44]
    senado: ["Política Social / Proteção Social", "Jurídico / Direitos e Garantias", "Política Social"]
  - id: ambiente
    nome: "Meio ambiente e energia"
    curto: "Meio ambiente"
    camara: [48, 54, 85]
    senado: ["Meio Ambiente", "Infraestrutura / Minas e Energia"]
  - id: agro
    nome: "Agro e terra"
    curto: "Agro"
    camara: [64, 51]
    senado: ["Economia e Desenvolvimento / Agropecuária e Abastecimento", "Economia e Desenvolvimento / Política Fundiária e Reforma Agrária"]
  - id: cidades
    nome: "Cidades, transporte e infraestrutura"
    curto: "Cidades"
    camara: [41, 61]
    senado: ["Infraestrutura", "Política Social / Habitação", "Política Social / Desenvolvimento Urbano", "Jurídico / Direito de Trânsito"]
  - id: politica
    nome: "Política, Estado e Justiça"
    curto: "Política"
    camara: [34, 53, 68, 74, 76, 42]
    senado: ["Administração Pública", "Organização do Estado", "Jurídico"]
  - id: exterior
    nome: "Relações exteriores e defesa"
    curto: "Relações exteriores"
    camara: [55]
    senado: ["Soberania, Defesa Nacional e Ordem Pública"]
  - id: tecnologia
    nome: "Ciência, tecnologia e comunicações"
    curto: "Ciência e tecnologia"
    camara: [62, 37]
    senado: ["Economia e Desenvolvimento / Ciência, Tecnologia e Informática", "Infraestrutura / Comunicações"]
  - id: homenagens
    nome: "Homenagens e datas"
    curto: "Homenagens"
    camara: [72]
    senado: ["Honorífico"]

# Índice de relevância (0 a 100) das matérias prontas para o Plenário e das aprovadas
# nos últimos 12 meses: sinais de relevância pública que dá para medir nos registros
# oficiais. NÃO diz se a matéria é boa ou ruim; diz quantos sinais ela tem. Cada nota
# aparece decomposta na página, e os pesos são escolha editorial.
relevancia:
  pesos:
    demanda: 40       # projetos parecidos anexados a ela (outros parlamentares pedindo o mesmo)
    origem: 25        # de onde veio: já aprovada na outra Casa, do Executivo, de comissão...
    alcance: 20       # o tipo de norma: PEC > lei complementar > lei
    apoio: 15         # autores de partidos diferentes (e dos dois polos)
  janela_demanda_anos: 0    # 0: contam todos os projetos parecidos anexados; N: só os apresentados nos N anos antes
  demanda_cheia: 15         # 15 projetos parecidos na janela dão a nota cheia (escala logarítmica)
  origem:                   # parte do peso de "origem" que cada origem recebe
    outra_casa: 1.0         # já aprovada pela outra Casa
    popular: 1.0            # iniciativa popular ou sugestão da sociedade
    executivo: 0.8
    comissao: 0.7           # comissões, CPIs e comissões mistas
    judiciario: 0.6         # tribunais, Ministério Público, Tribunal de Contas, Defensoria
    parlamentar: 0.0
  alcance: {PEC: 1.0, PLP: 0.8, PL: 0.6, PLS: 0.6, PLC: 0.6, PDL: 0.3}
  simbolica_teto: 10        # matéria simbólica (dia nacional, denominação, título) não passa disto
  alta: 60                  # a partir daqui, sinais fortes
  baixa: 30                 # abaixo daqui, sinais fracos

# A pauta: por que cada matéria aprovada pelo Plenário andou ("O que espera × o que passa").
# Sete sinais, todos sim ou não, lidos no registro oficial de cada matéria aprovada em 12
# meses. Nenhum diz que a matéria é ruim nem prova pressa indevida: dizem por onde ela passou.
#   urgência         o Plenário aprovou o requerimento de urgência (Regimento da Câmara, art. 155)
#   sem comissão     o parecer foi dado por um relator no Plenário, no lugar das comissões
#   relâmpago        do protocolo ao voto em até `relampago_dias`
#   urgência no dia  a urgência e o texto foram votados no mesmo dia
#   sem registro     nenhuma votação nominal do texto principal: não há lista de quem votou o quê
#   próprio jogo     a ementa casa com um padrão de `proprio_jogo`
#   sinais fracos    nota de relevância abaixo de `relevancia.baixa`
# No Senado o registro não traz o caminho: valem só relâmpago, sem registro, próprio jogo e fracos.
pauta:
  relampago_dias: 30        # "relâmpago": do protocolo ao voto em até 30 dias
  sinais_vale_olhar: 4      # "vale olhar": 4 sinais ou mais (a urgência sozinha, a mais comum, não conta)
  sinais_vale_olhar_senado: 3   # no Senado o registro só permite ler quatro sinais: 3 ou mais
  surto_vezes: 2            # "semana cheia": 2 vezes a mediana das semanas em que houve aprovação
  ementa_ate: 400           # "próprio jogo": o padrão tem de começar nos primeiros 400 caracteres da ementa
  tema_minimo: 50           # a direção por tema só aparece se ao menos 50% das aprovadas e das que esperam têm tema no registro
  # O calendário oficial, anotado no "quando vota". Só datas, sem dizer causa. MM-DD vale para
  # todo ano: o Congresso se reúne de 2 de fevereiro a 17 de julho e de 1º de agosto a 22 de
  # dezembro (Constituição, art. 57). AAAA-MM-DD vale para aquele dia.
  calendario:
    - {nome: "recesso de julho", de: "07-18", ate: "07-31"}
    - {nome: "recesso de fim de ano", de: "12-23", ate: "02-01"}
    - {nome: "eleições (1º turno)", de: "2026-10-04"}
  # "Regras do próprio jogo": matérias sobre eleições, partidos, mandatos, emendas ou os cargos
  # das próprias Casas (quem vota decide sobre regras que valem para si). Os padrões valem sobre
  # a ementa sem acento e em minúsculas ("nº" vira "no"). Cada um foi conferido contra as
  # ementas das matérias prontas e das aprovadas; o que pegava matéria de outro assunto saiu.
  proprio_jogo:
    - id: eleicoes
      nome: "eleições"
      padroes:
        - '\bcodigo eleitoral\b'
        - '\blei das eleicoes\b'
        - '\blei (?:n[o0]? ?)?9 504\b'
        - '\blei (?:n[o0]? ?)?4 737\b'
        - '\beleicoes\b'
        - '\beleicao (?:indireta|direta|presidencial|suplementar)\b'
        - '\bcampanhas? eleitora(?:l|is)\b'
        - '\bpropaganda (?:eleitoral|partidaria)\b'
        - '\binelegi(?:bilidade|vel|veis)'
        - '\blei complementar (?:n[o0]? ?)?64\b'
        - '\bficha limpa\b'
        - '\bcandidaturas?\b'
        - '\bsistema eleitoral\b'
        - '\bcoligac(?:ao|oes)\b'
        - '\bquociente eleitoral\b'
        - '\bsobras eleitorais\b'
        - '\bpesquisas? (?:e testes )?(?:pre )?eleitora(?:l|is)\b'
        - '\bcrimes? eleitora(?:l|is)\b'
        - '\blegislacao eleitoral\b'
        - '\bdomicilio eleitoral\b'
        - '\burnas? eletronicas?\b'
        - '\bvoto (?:impresso|distrital|facultativo)\b'
        - '\bviolencia politica\b'
        - '\blei (?:n[o0]? ?)?14 192\b'
    - id: partidos
      nome: "partidos"
      padroes:
        - '\bpartidos? politicos?\b'
        - '\blei dos partidos\b'
        - '\blei (?:n[o0]? ?)?9 096\b'
        - '\bfederac(?:ao|oes) (?:de partidos|partidarias?)\b'
        - '\b(?:fidelidade|filiacao|janela|agremiac(?:ao|oes)|convenc(?:ao|oes)|dirigentes?|orgaos?|diretorios?|contas) partidari[oa]s?\b'
        - '\bclausula de (?:barreira|desempenho)\b'
        - '\bcriacao de partido\b'
    - id: fundos
      nome: "fundos de campanha"
      padroes:
        - '\bfundo (?:especial )?de financiamento de campanha'
        - '\bfundo eleitoral\b'
        - '\bfundos? partidario'
        - '\bfefc\b'
        - '\bfinanciamento (?:publico )?(?:de|das) campanhas?\b'
        - '\bfinanciamento eleitoral\b'
        - '\bdoac(?:ao|oes) (?:eleitora(?:l|is)|de campanha|a partidos|a candidatos)'
    - id: mandato
      nome: "mandato"
      padroes:
        - '\bperda d[eo] mandato\b'
        - '\bdecoro parlamentar\b'
        - '\bsuplentes? de (?:deputad|senador|vereador)'
        - '\bmandatos? (?:parlamentar(?:es)?|de (?:deputad|senador|vereador|prefeit|governador|presidente da republica))'
        - '\bsubsidios? .{0,140}?\b(?:senador(?:es)?|deputados|vereadores|membros do congresso|parlamentares)\b'
        - '\b(?:remuneracao|aposentadoria|pensao|verbas?) (?:d[eo]s? |para )?(?:os |as )?(?:membros do congresso|parlamentar(?:es)?|deputad[oa]s|senador(?:es|as)?|congressistas|vereador(?:es|as)?|prefeit[oa]s)'
        - '\bseguridade social dos congressistas\b'
        - '\batividade parlamentar\b'
        - '\breeleicao\b'
        - '\bposse d[eo]s? (?:presidente|governador|prefeit|deputad|senador|vereador)'
        - '\btransicao (?:administrativa|de governo|de mandato|governamental)\b'
        - '\bresponsabilidade dos prefeitos\b'
        - '\bdecreto lei (?:n[o0]? ?)?201\b'
        - '\bimpeachment\b'
        - '\bcrimes? de responsabilidade d[eo]s? (?:presidente da republica|governador|prefeit|ministros? de estado)'
    - id: imunidade
      nome: "imunidade"
      padroes:
        - '\bimunidades? parlamentar'
        - '\bprerrogativas? (?:parlamentar|d[eo]s? (?:deputad|senador|parlamentar|membros do congresso))'
        - '\bforo (?:privilegiado|especial|por prerrogativa)'
        - '\bprerrogativa de (?:foro|funcao)\b'
        - '\binviolabilidade (?:d[eo]s? )?(?:deputad|senador|parlamentar)'
        - '\bprisao de (?:deputad|senador|parlamentar)'
    - id: emendas
      nome: "emendas parlamentares"
      padroes:
        - '\bemendas? parlamentar(?:es)?\b'
        - '\bemendas? (?:individua(?:l|is)|de bancadas?|de comiss(?:ao|oes)|de relator)\b'
        - '\bemendas impositivas\b'
        - '\btransferencias? especia(?:l|is)\b'
        - '\bprogramac(?:ao|oes) (?:orcamentarias? )?incluidas? por emendas?'
        - '\blei complementar (?:n[o0]? ?)?210\b'
    - id: cadeiras
      nome: "cadeiras"
      padroes:
        - '\bnumero (?:maximo |total |minimo )?de (?:\w+ )?(?:deputados|vereadores|senadores|cadeiras|representantes)\b'
        - '\brepresentacao (?:dos estados |popular )?na camara dos deputados\b'
        - '\bcomposicao da camara dos deputados\b'
        - '\blei complementar (?:n[o0]? ?)?78\b'
        - '\b(?:reserva\w*|vagas) .{0,60}?\b(?:na camara dos deputados|nas assembleias legislativas|nas camaras municipais)\b'
    - id: anistia
      nome: "anistia a partidos"
      padroes:
        - '\banisti\w* .{0,80}?(?:partidos?|candidat|eleitora|prestac(?:ao|oes) de contas)'
        - '\b(?:regularizacao|refinanciamento) de debitos de partidos\b'
    - id: casas
      nome: "cargos das Casas"
      padroes:
        - '\b(?:cargos?|carreiras?|quadro de pessoal|servidores|estrutura administrativa|plano de carreira|funcoes comissionadas)\b.{0,80}?\b(?:da|na|do|no) (?:camara dos deputados|senado federal)\b'
        - '\bcarreira legislativa\b'
        - '\bsecretariado parlamentar\b'

# Apelidos de projetos, como o noticiário os chama: servem para achar o projeto quando o
# jornal não cita o número, e aparecem ao lado do número na página (o primeiro da lista).
# Cada um foi conferido contra a ementa oficial. Apelido que vale para mais de um projeto
# (como "reforma tributária" ou "PL da Anistia") fica de fora.
apelidos:
  "PL 2630/2020": ["PL das Fake News", "PL da Censura"]
  "PLP 93/2023": ["arcabouço fiscal"]
  "PEC 3/2021": ["PEC da Blindagem", "PEC das Prerrogativas"]
  "PL 1904/2024": ["PL do Aborto", "PL do Estupro"]
  "PL 2159/2021": ["PL do Licenciamento Ambiental", "PL da Devastação", "Lei Geral do Licenciamento"]
  "PL 914/2024": ["taxa das blusinhas", "taxação das blusinhas"]
  "PEC 18/2025": ["PEC da Segurança Pública"]
  "PEC 221/2019": ["PEC da escala 6x1", "escala 6x1"]
  "PL 5582/2025": ["PL Antifacção", "Lei Antifacção"]
  "PL 2162/2023": ["PL da Dosimetria", "Lei da Dosimetria"]
  "PEC 45/2023": ["PEC das Drogas"]
  "PL 2338/2023": ["PL da Inteligência Artificial", "PL da IA"]
  "MPV 1303/2025": ["MP do IOF"]

# Régua "Projeto de país": quanto cada proposição (PL, PLP, PEC) mexe em regra de sistema nas
# alavancas do objetivo declarado (PESO, 0 a 100) e três marcas do que a ementa enuncia (SINAL):
# contas, isonomia e controle. Um leitor de IA marca seis campos e um alerta; a nota sai desta
# fórmula. NÃO diz se o projeto é bom nem se falta fonte: diz o que a ementa enuncia. As áreas
# do núcleo e os valores das marcas são escolha editorial.
# As leituras ficam em data/congresso/leitura/ (um arquivo por Casa e ano, uma proposição por
# linha) e entram por "python -m qijournal congresso leitura importar"; as instruções que o
# leitor recebe estão em config/leitura_projetos.txt e citam exatamente os códigos daqui.
# Mudar peso, valor ou corte neste bloco não exige reler; mudar as instruções exige (leitura.versao).
# O que a régua pede e esta entrega NÃO faz (a página não pode dizer que fez): não há padrão
# codificado à mão (mede-se a concordância entre duas leituras independentes de IA); a segunda
# leitura é da ementa, por outro leitor, e não do texto integral; a matéria votada é lida pela
# ementa do registro, não pelo texto votado; o parecer da CFT não é lido; e "reapresentada" é a
# ementa igual, depois de normalizada, à de proposição anterior na mesma Casa.
projeto_de_pais:
  objetivo: "infraestrutura, educação e economia que cresce, com câmbio e custo de vida sob controle"
  nivel: {nucleo: 1.0, entorno: 0.6, fora: 0.3}     # peso de cada nível de alavanca
  nivel_rotulo: {nucleo: "núcleo", entorno: "entorno", fora: "fora do objetivo"}   # como o nível aparece na conta do peso
  campos:
    alavanca:
      chave: a
      rotulo: "Em que sistema mexe"
      codigos:
        - {id: fiscal, nivel: nucleo, rotulo: "Contas públicas e tributos", def: "regra fiscal, orçamento, emendas, dívida, tributos e benefícios fiscais, aposentadorias e pensões"}
        - {id: infra, nivel: nucleo, rotulo: "Infraestrutura", def: "transporte, energia, saneamento, telecomunicações, concessões"}
        - {id: educacao, nivel: nucleo, rotulo: "Educação e qualificação", def: "aprendizagem, avaliação, financiamento, vagas, carreira docente, primeira infância, ensino técnico"}
        - {id: produtividade, nivel: nucleo, rotulo: "Mercados e produtividade", def: "regra econômica de empresas, crédito, concorrência, comércio exterior, trabalho, contratos, propriedade e registros, inovação"}
        - {id: estado, nivel: nucleo, rotulo: "Máquina pública", def: "gestão, compras públicas, servidores, controle e transparência"}
        - {id: social, nivel: entorno, rotulo: "Saúde e proteção social", def: "SUS, assistência, benefícios pagos a pessoas (BPC, Bolsa Família, seguro-desemprego)"}
        - {id: justica, nivel: entorno, rotulo: "Segurança e Justiça", def: "crime, pena, polícia, processo civil e penal, Judiciário"}
        - {id: ambiente, nivel: entorno, rotulo: "Meio ambiente e território", def: "licenciamento, clima, uso da terra"}
        - {id: institucional, nivel: entorno, rotulo: "Regras políticas", def: "eleições, partidos, mandatos, Poderes, federação"}
        - {id: outro, nivel: fora, rotulo: "Fora do objetivo", def: "costumes, família, proteção de crianças e adolescentes, conteúdo na internet, cultura, esporte, trânsito, homenagens"}
    escopo:
      chave: e
      rotulo: "Quem a mudança alcança"
      codigos:
        - {id: geral, peso: 1.0, rotulo: "Todos", def: "toda a população, todos os contribuintes, empresas ou trabalhadores, todo o orçamento, todos os entes de um nível, ou a rede nacional inteira de uma alavanca"}
        - {id: setor, peso: 0.6, rotulo: "Um segmento inteiro", def: "uma atividade econômica, um modal, uma etapa de ensino, um tributo ou um programa orçamentário inteiro"}
        - {id: grupo, peso: 0.4, rotulo: "Um grupo ou objeto", def: "categoria, perfil de beneficiário, porte ou tipo de empresa, produto, doença, crime, rito ou região"}
        - {id: local, peso: 0.1, rotulo: "Um caso", def: "município, estado, entidade, pessoa, data ou evento nomeado"}
    mecanismo:
      chave: m
      rotulo: "O que o projeto faz"
      codigos:
        - {id: sistema, peso: 1.0, rotulo: "Regra de sistema", def: "cria, substitui ou revoga a regra geral de um sistema, e a ementa diz qual: a norma ou o modelo de provisão e financiamento de uma rede"}
        - {id: ajuste, peso: 0.6, rotulo: "Ajuste de regra", def: "muda limite, critério, procedimento ou competência de uma regra geral"}
        - {id: servico, peso: 0.5, rotulo: "Serviço ou estrutura", def: "manda o Estado prestar um atendimento com destinatário nomeado, ou cria unidade, órgão, cargo ou cadastro"}
        - {id: conduta, peso: 0.4, rotulo: "Obriga, proíbe ou permite", def: "obriga, proíbe ou permite uma conduta de pessoas, empresas, profissionais ou órgãos, sem mudar regra de sistema"}
        - {id: beneficio, peso: 0.4, rotulo: "Benefício ou exceção", def: "dá, amplia, restringe ou retira isenção, gratuidade, aposentadoria especial, piso, regime favorecido ou reserva; inclui regulamentar profissão"}
        - {id: pena, peso: 0.4, rotulo: "Crime e pena", def: "cria crime ou muda pena, prescrição ou execução penal"}
        - {id: diretriz, peso: 0.15, rotulo: "Política declaratória", def: "política, programa, plano ou campanha só com princípios, diretrizes e objetivos"}
        - {id: simbolico, peso: 0.0, rotulo: "Simbólico", def: "data, título, denominação, homenagem"}
    custo:
      chave: ct
      marca: contas
      rotulo: "O que a ementa faz com o caixa"
      codigos:
        - {id: gasto, valor: -1, rotulo: "Cria despesa (fonte não aparece na ementa)", def: "benefício, serviço obrigatório, órgão, cargo, piso ou inclusão em programa, pagos pelo poder público"}
        - {id: renuncia, valor: -1, rotulo: "Cria renúncia (compensação não aparece na ementa)", def: "isenção, alíquota ou tabela favorecida, dedução, regime ampliado, perdão ou parcelamento de dívida"}
        - {id: vincula, valor: -1, rotulo: "Carimba recurso", def: "vinculação, percentual mínimo, fundo ou destinação obrigatória"}
        - {id: repassa, valor: -1, rotulo: "Repassa o custo a terceiros", def: "gratuidade, desconto, folga ou benefício a grupo determinado, pago por empregador, concessionário ou demais usuários"}
        - {id: investe, valor: 0, rotulo: "Investe em rede do núcleo", def: "obra, equipamento, vaga nova ou expansão de rede, só em infra ou educacao"}
        - {id: prisional, valor: 0, rotulo: "Custo prisional (não aparece na ementa)", def: "crime novo com prisão, pena maior, regime ou progressão mais duros"}
        - {id: fonte, valor: 0, rotulo: "Com fonte dita", def: "cria custo, e a ementa nomeia a receita ou o corte que o cobre, ou cobra de quem dá causa"}
        - {id: neutro, valor: 0, rotulo: "Sem custo legível", def: "simbólico, rito, regra de conduta ou norma geral cujo custo fica com o obrigado"}
        - {id: corta, valor: 1, rotulo: "Contém despesa", def: "reduz, limita, focaliza ou desvincula despesa ou renúncia"}
        - {id: arrecada, valor: 1, rotulo: "Amplia receita", def: "cria ou aumenta tributo ou amplia a base, sem abrir exceção"}
    isonomia:
      chave: is
      marca: isonomia
      rotulo: "Para quem a regra é diferente"
      codigos:
        - {id: profissao, valor: -1, rotulo: "Para uma profissão", def: "regime, piso, reserva, aposentadoria ou exigência de entrada próprios de uma categoria profissional; inclui regulamentar profissão"}
        - {id: ramo, valor: -1, rotulo: "Para um setor ou tipo de empresa", def: "regime, isenção, dispensa ou reserva próprios de setor, porte ou tipo de empresa, produto ou entidade"}
        - {id: territorio, valor: -1, rotulo: "Para um lugar", def: "regime, incentivo ou destinação próprios de município, estado ou região"}
        - {id: pessoal, valor: 0, rotulo: "Por condição da pessoa", def: "benefício ou regime definido por renda, idade, deficiência, doença, raça, gênero, vitimização ou conduta"}
        - {id: neutro, valor: 0, rotulo: "Não diferencia", def: "a regra não cria nem desfaz tratamento diferente"}
        - {id: iguala, valor: 1, rotulo: "Desfaz exceção", def: "revoga, reduz ou estende a todos um regime, isenção, reserva ou exigência de entrada restrita a categoria, setor, empresa ou lugar"}
    controle:
      chave: co
      marca: controle
      rotulo: "Aperta ou afrouxa o controle"
      conjuntos: ["regra fiscal e orçamentária", "licitação, contratação e transparência", "responsabilização de agente público", "contrato vigente e efeito retroativo"]
      codigos:
        - {id: afrouxa, valor: -1, rotulo: "Afrouxa", def: "excepciona, dispensa, exclui do limite, permite o que a regra veda, anistia ou veda sanção a agente público ou ente, retroage sobre contrato"}
        - {id: neutro, valor: 0, rotulo: "Não mexe", def: "fora dos quatro conjuntos"}
        - {id: aperta, valor: 1, rotulo: "Aperta", def: "limita ou condiciona gasto, exige transparência, competição ou avaliação, cria sanção ou quarentena para agente público"}
  nd: "a ementa não permite dizer"   # aceito em todo campo; em alavanca, escopo ou mecanismo: sem leitura
  arredonda: meio_para_cima          # peso = 100 x nível x escopo x mecanismo
  faixas:                            # sobre o peso já arredondado
    - {id: minimo, rotulo: "mínimo", de: 0, descricao: "simbólico, declaratório, de um caso só ou fora do objetivo"}
    - {id: pontual, rotulo: "pontual", de: 10}
    - {id: medio, rotulo: "médio alcance", de: 20}
    - {id: estruturante, rotulo: "estruturante", de: 60, so_nivel: nucleo}   # 60 no entorno fica em médio alcance
  # Sinal: três marcas lado a lado (contas, isonomia, controle), cada uma com o valor do seu código.
  # Nunca somadas entre si nem multiplicadas pelo peso. Não há rótulo único.
  # Como a página escreve cada valor de cada marca (+1, 0, -1 e sem valor). "forma" é a do ponto
  # nos gráficos (cheio, vazado, losango). A marca negativa não diz "ruim" nem "sem fonte": diz o
  # que a ementa enuncia.
  marcas:
    contas:
      rotulo: "Contas"
      valores:
        - {id: poupa, valor: 1, rotulo: "alivia o caixa", forma: cheio}
        - {id: neutro, valor: 0, rotulo: "sem efeito legível no caixa", forma: vazado}
        - {id: onera, valor: -1, rotulo: "pesa no caixa (fonte não aparece na ementa)", forma: losango}
        - {id: nd, rotulo: "a ementa não permite dizer", forma: vazado}
    isonomia:
      rotulo: "Isonomia"
      valores:
        - {id: iguala, valor: 1, rotulo: "desfaz exceção", forma: cheio}
        - {id: neutro, valor: 0, rotulo: "sem exceção para profissão, setor ou lugar", forma: vazado}
        - {id: excecao, valor: -1, rotulo: "abre exceção para profissão, setor ou lugar", forma: losango}
        - {id: nd, rotulo: "a ementa não permite dizer", forma: vazado}
    controle:
      rotulo: "Controle"
      valores:
        - {id: aperta, valor: 1, rotulo: "aperta o controle", forma: cheio}
        - {id: neutro, valor: 0, rotulo: "não mexe em regra de controle", forma: vazado}
        - {id: afrouxa, valor: -1, rotulo: "afrouxa o controle", forma: losango}
        - {id: nd, rotulo: "a ementa não permite dizer", forma: vazado}
  sensibilidade:                     # escolhas discutíveis: a página publica o que muda com a alternativa
    - {campo: custo, codigo: arrecada, padrao: 1, alternativa: 0}
    - {campo: custo, codigo: investe, padrao: 0, alternativa: -1}
    - {campo: custo, codigo: prisional, padrao: 0, alternativa: -1}
    - {campo: custo, codigo: vincula, padrao: -1, alternativa: 0}
  alerta_iniciativa: {chave: in, origem: parlamentar, tipos: [PL, PLP]}   # art. 61, § 1º, II, a, c, e
  alertas:                           # os avisos que acompanham uma leitura, como a página os escreve
    iniciativa: "pode tratar de matéria de iniciativa do Executivo (pista, não parecer jurídico)"
    a_confirmar: "estruturante pela ementa, à espera da segunda leitura"   # até lá, conta na faixa de baixo
    duvida: "a ementa admite outra leitura, e só um leitor leu"
  # De onde vem cada leitura. Toda leitura é de IA e fica guardada em data/congresso/leitura/; a
  # proposição que ainda não está lá fica sem leitura. "ia2": duas leituras de IA, ou mais, na mesma
  # faixa (a faixa do topo e o voto fiscal só contam com "ia2"). "regra" é o encaixe de um leitor de
  # regras (sem IA), que não foi construído: hoje nenhuma leitura vem dele.
  fontes:
    regra: "lido por regras"
    ia: "lido por IA"
    ia2: "lido por IA, duas vezes"
  selo: "Leitura por IA, com régua pública"   # o selo da tela
  cft: [adequada, inadequada, nao_implica, sem_parecer]   # do histórico da Câmara, sem IA; só "inadequada" autoriza "sem fonte". Ainda não é lido: nada na página sai deste campo
  segunda_leitura:                   # a régua pede o inteiro teor; por ora é outra leitura, independente, da mesma ementa
    peso_minimo: 60
    nd_tipos: [PEC, PLP]             # só com o inteiro teor (reler a mesma ementa daria "nd" de novo): ainda não se aplica
    nd_prontas_e_votadas: true       # idem
  autoria:
    reapresentada_similaridade: 0.9  # ementa igual à de proposição anterior de qualquer autor na Casa
    bancada_coautores: 10            # coautores do mesmo partido: "de bancada", conta só no partido
    bancada_fracao: 0.5
    onde_mira_sem: [beneficio]
  limiares:
    perfil_minimo: 10        # lidos para percentuais, mediana e rankings
    perfil_lista: 3          # de 3 a 9: a lista e a ponta
    ponta: 3                 # média dos 3 maiores pesos (protocolada e que andou); nunca em ranking
    saldo_minimo: 5          # projetos com contas +1 ou -1 para o saldo de contas
    partido_minimo: 5        # perfis para a mediana do partido
    andamento_peso: 20
    voto_peso: 20            # "nas matérias de peso"
    voto_minimo: 10
    voto_fechado: 0.80       # com orientação Sim ou Não
    voto_condicao: 5         # votações em cada condição e sob cada governo
    voto_quase_unanime: 0.90 # fora de todos os itens
    pessoas_minimo: 50       # abaixo disto: "não dá para responder por pessoa"
    confianca: 0.95          # intervalo por partido, reamostragem de membros
    longe_do_partido: 20     # só apresentação: a tantos pontos da mediana do próprio partido, o ponto da pessoa sai em destaque
    teto_pontos: 600         # só apresentação: máximo de pontos por Casa no gráfico dos projetos (entram os de maior peso)
  leitura:
    cega: true               # sem autor, partido, origem nem número
    id_opaco: true
    piloto: 1000             # antes da leitura completa
    faixa_alerta: 0.5        # faixa acima disto no piloto: o corte muda uma vez, por significado
    padrao_a_mao: 300        # duas pessoas, independentes
    fracao_plp_pec: 0.5      # no piloto e no padrão
    concordancia_minima: 0.6 # por código; peso: fundem-se os códigos; sinal: o campo sai das contas
    reler_confianca: 1       # cf 1 é relido; faixas diferentes: sem leitura
    candidatas_peso: 60      # peso pela leitura de regras, em alavanca do núcleo, a partir do qual a proposição vai à IA (candidata ao topo)
    versao: 1                # das instruções ao leitor (config/leitura_projetos.txt): sobe quando elas mudam de modo que exija reler, e as leituras gravadas com a versão antiga deixam de valer
    tipos: [PL, PLP, PEC, PLS, PLC]   # o que se lê; PLS e PLC são os projetos de lei na numeração do Senado anterior a 2019
    tipos_votadas: [MPV, PLV]         # a mais, só nas matérias com votação nominal do texto principal no Plenário
    estados:                 # o estado de cada leitura gravada ("r") e como a página o diz
      - {r: 1, rotulo: "lido na ementa, por um leitor"}
      - {r: 2, rotulo: "lido na ementa, por dois leitores"}
      - {r: 3, rotulo: "lido na ementa, por três leitores (os dois primeiros divergiram)"}
      - {r: 0, rotulo: "leitura instável (os leitores não se entenderam): fica sem leitura"}
    # A leitura diária (python -m qijournal congresso ler): todo dia, no fim da edição diária (com a
    # edição já publicada; no fluxo manual do Congresso, logo antes da atualização), a cadeia de IAs
    # do jornal (llm.providers, em config/site.yaml) lê as proposições novas e as matérias que foram
    # a voto, e relê o que muda a conta, com as instruções de config/leitura_projetos.txt. O que for
    # lido na edição diária entra nas contas na atualização seguinte.
    # Em cada lote vão, misturadas e sem aviso, perguntas de controle (config/leitura_referencia.jsonl:
    # proposições reais que dois leitores classificaram igual); o lote que erra nelas é descartado.
    # O registro de cada dia fica em data/congresso/leitura/diario.json. Desligar sem mexer aqui:
    # QIJ_NO_LEITURA=1.
    diaria:
      ligada: true
      primeiras: 150         # teto de primeiras leituras por rodada (chegam cerca de 25 proposições novas por dia)
      segundas: 60           # teto de segundas leituras por rodada: só as que mudam a conta (peso do topo e matérias votadas)
      lote: 30               # proposições por chamada à IA (os controles vão a mais)
      controles: 10          # perguntas de controle em cada lote (a mesma régua de aceite da leitura inicial: 7 de 10)
      controles_minimo: 7    # acertos (a faixa, pela fórmula) abaixo disto: o lote inteiro é descartado
      prazo_segundos: 480    # prazo da leitura, do primeiro lote ao último (8 min; cabe no timeout do passo)
      chamadas: 12           # teto de chamadas à IA por rodada (150 primeiras = 5; 60 segundas = 2; o resto, terceiras leituras)
      editores: []           # vazio: toda a cadeia de llm.providers; ou só estes, nesta ordem (ex.: [gemini, gemini_lite])
      dias: 60               # dias guardados no registro
  pares_espelho:            # teste de aceite: os dois lados têm de cair na mesma faixa
    - {id: provisao_ou_norma, a: {caso: "tempo integral obrigatório em toda a educação básica", codigos: [educacao, geral, sistema]}, b: {caso: "substitui os tributos sobre o consumo por um imposto único", codigos: [fiscal, geral, sistema]}}
    - {id: investir_ou_conceder, a: {caso: "plano de investimento público em ferrovias, com meta e fonte", codigos: [infra, setor, sistema]}, b: {caso: "novo marco de concessões do saneamento", codigos: [infra, setor, sistema]}}
    - {id: cortar_gasto_ou_renuncia, a: {caso: "limita o crescimento de despesa obrigatória", codigos: [fiscal, geral, ajuste]}, b: {caso: "corta 10% dos benefícios tributários", codigos: [fiscal, geral, ajuste]}}
    - {id: baixar_ou_criar_tributo, a: {caso: "reduz a alíquota geral de um imposto", codigos: [fiscal, geral, ajuste]}, b: {caso: "aumenta a alíquota geral de um imposto", codigos: [fiscal, geral, ajuste]}}
    - {id: regular_ou_desregular, a: {caso: "cria regime de regulação econômica para um mercado", codigos: [produtividade, setor, sistema]}, b: {caso: "revoga o regime de regulação do mesmo mercado", codigos: [produtividade, setor, sistema]}}
    - {id: jornada, a: {caso: "reduz a jornada máxima de todos os empregados", codigos: [produtividade, geral, ajuste]}, b: {caso: "amplia a jornada máxima de todos os empregados", codigos: [produtividade, geral, ajuste]}}
    - {id: fundo_ou_teto, a: {caso: "torna permanente o fundo de financiamento da educação básica", codigos: [educacao, geral, sistema]}, b: {caso: "institui limite para a despesa primária", codigos: [fiscal, geral, sistema]}}
    - {id: saude_ou_pena, a: {caso: "inclui um item em programa de medicamentos", codigos: [social, grupo, beneficio]}, b: {caso: "aumenta a pena de um crime", codigos: [justica, grupo, pena]}}
  # As matérias votadas são lidas como as demais (pela ementa do registro, duas vezes) e as leituras
  # ficam na mesma guarda, data/congresso/leitura/: não há lista de votadas neste arquivo.
  # "Pessoa ou partido?": os cortes de quanto o partido explica (abaixo de 30% diz pouco; de 70% em
  # diante, quase tudo), quantos sorteios fazem o traço do acaso (partidos embaralhados entre as
  # pessoas) e o intervalo (pessoas reamostradas), e a semente que torna os sorteios repetíveis.
  cruzar: {zonas: [30, 70], permutacoes: 1000, reamostras: 2000, semente: 57}
  # Quem é quem nas contas da visão por parlamentar (qijournal/congresso/pais.py), para o Python
  # não escrever nome de marca, de alavanca nem de escopo. "caixa": a marca que a tela mostra como
  # direção e que dá o saldo de contas e o voto fiscal; "excecao": a da taxa de exceção;
  # "controle": a que também conta no voto fiscal, só na alavanca "alavanca_do_caixa"; essa
  # alavanca entra no voto fiscal com qualquer peso, menos nos escopos de
  # "voto_fiscal_sem_escopo" (régua, seção 5, item B).
  papeis: {caixa: contas, excecao: isonomia, controle: controle, alavanca_do_caixa: fiscal, voto_fiscal_sem_escopo: [local]}

# Frentes parlamentares de causa: quem assina cada uma e como vota no tema dela. Só a Câmara
# registra quem assina (o Senado não publica as frentes). "titulo": o começo do título
# oficial (vale para qualquer legislatura em que a frente for registrada de novo com o mesmo
# nome; se dois registros casarem, vale o de mais membros); "nome": como aparece na página;
# "tema": o tema da aba em que a causa se vota ("todas": a frente não tem um tema só, e conta
# todas as votações esquerda × direita). A frente não registra posição: a página compara o
# voto de cada membro com o do coordenador, que é quem a registra. Assinar é barato: na
# legislatura 57, um deputado assina, na mediana, 109 das 320 frentes. A lista tem as duas
# pontas de cada tema, para não escolher lado.
frentes:
  - {titulo: "Frente Parlamentar Mista pelo Livre Mercado", nome: "Livre Mercado", tema: economia}
  - {titulo: "Frente Parlamentar contra os Juros Abusivos", nome: "Contra os Juros Abusivos", tema: economia}
