# Famílias: um grupo por UF (ou por município), reconhecido pelo nome. {uf} é o nome da UF sem
# acento (ufs); o id e o nome de exibição usam a sigla e o nome com acento. As raízes conferidas
# no acervo do STJ entram em "raizes_por_uf" (reforço: o nome já basta).
familias:
  - id: estado
    categoria: estado
    grupo: "estado-{sigla}"          # estado-sp
    nome: "{artigo_uf} {uf_nome}"    # "Estado de São Paulo"; DF: "Distrito Federal"
    padroes:
      - "(?:FAZENDA (?:PUBLICA )?(?:D[OAE] )?)?ESTADO D[OAE] {uf}"
      - "FAZENDA PUBLICA ESTADUAL D[OAE] {uf}"
    distrito_federal: ["DISTRITO FEDERAL", "FAZENDA PUBLICA DO DISTRITO FEDERAL"]
    raizes_por_uf:
      SP: ["46379400", "46377222"]   # Estado de São Paulo; Fazenda do Estado de São Paulo
      RJ: ["42498600"]
      MG: ["18715615"]
      GO: ["01409580"]
      RS: ["87934675"]
      SC: ["82951229"]
      PR: ["76416940"]
      BA: ["13937032"]
      MT: ["03507415"]
      TO: ["01786029"]
      MA: ["06354468"]
      MS: ["15412257"]
      ES: ["27080530"]
      CE: ["07954480"]
      PB: ["08761124"]
      PE: ["10571982"]
      PI: ["06553481"]
      RN: ["08241739"]
      DF: ["00394601"]
  - id: mp
    categoria: mp
    grupo: "mp-{sigla}"              # mp-sp
    nome: "Ministério Público de {uf_nome}"
    padroes: ["MINISTERIO PUBLICO DO ESTADO D[OAE] {uf}", "PROCURADORIA[- ]GERAL DE JUSTICA DO ESTADO D[OAE] {uf}"]
  - id: defensoria
    categoria: defensoria
    grupo: "dpe-{sigla}"             # dpe-sp
    nome: "Defensoria Pública de {uf_nome}"
    padroes: ["DEFENSORIA PUBLICA DO ESTADO D[OAE] {uf}", "DEFENSORIA PUBLICA D[OA] {uf}"]
  - id: assembleia
    categoria: legislativo
    grupo: "assembleia-{sigla}"      # assembleia-sp
    nome: "Assembleia Legislativa de {uf_nome}"
    padroes: ["(?:MESA DA )?ASSEMBLEIA LEGISLATIVA DO ESTADO D[OAE] {uf}", "(?:MESA DA )?ASSEMBLEIA LEGISLATIVA D[OAE] {uf}"]
  - id: municipio
    categoria: municipio
    grupo: "municipio-{slug}"        # municipio-sao-paulo (sem a UF: a fonte não a traz junto)
    nome: "Município de {nome}"
    # o nome do município vai até a vírgula, o " - " ou o fim (grupo "nome" da expressão)
    padroes: ["(?:FAZENDA PUBLICA DO )?MUNICIPIO D[EOA]S? (?P<nome>[A-Z][A-Z' ]*?[A-Z])", "PREFEITURA MUNICIPAL D[EOA]S? (?P<nome>[A-Z][A-Z' ]*?[A-Z])"]

