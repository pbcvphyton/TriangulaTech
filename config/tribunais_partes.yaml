# Analítico dos Tribunais: o catálogo de litigantes ("Quem se repete").
#
# Lido por qijournal/tribunais/partes.py (carregar_catalogo). Tudo aqui é escolha editorial ou
# registro conferido à mão no acervo do STJ de 20/11/2026 e na planilha do STF de 22/11/2026, e vai
# escrito no "Como ler".
#
# Como uma parte vira um litigante (analista jurídico §5):
#   1. o PAPEL decide antes de tudo: autoridade (o tribunal impetrado no HC, os juízos do conflito,
#      o próprio STJ como requisitante do precatório) e qualificador (representado por, herdeiros de,
#      outro nome) nunca são litigantes; pessoa física e MEI (CNPJ com CPF no fim do nome) nunca têm
#      nome, em lugar nenhum;
#   2. STJ: a RAIZ DO CNPJ (8 dígitos, com o dígito verificador conferido) — nunca um prefixo solto:
#      00394 começa a Fazenda Nacional (00394460), o Distrito Federal (00394601) e o Ministério da
#      Justiça (00394494);
#   3. STF (a planilha não traz CNPJ) e partes do STJ sem CNPJ: o NOME, pelos padrões abaixo, sem
#      acento e em maiúsculas; no texto bruto de um polo do STF os nomes às vezes vêm COLADOS
#      ("UNIÃOFUNDAÇÃO NACIONAL…"): a busca aceita o começo de um nome colado no fim de outro;
#   4. pessoa jurídica fora do catálogo: o grupo é a própria raiz ("cnpj-<raiz>"), com o nome mais
#      frequente no arquivo; sem CNPJ, o nome normalizado ("nome-<slug>").
# Nome na página só com 20 processos ou mais no tribunal, ou 5 ou mais no acervo do ministro
# (limiares do config/tribunais.yaml). Grupos econômicos (o Itaú e as suas várias raízes, a Aymoré
# dentro do Santander) NÃO são juntados: precisaria de fonte (a lista de conglomerados do Banco
# Central) e é escolha sujeita a erro (fase 2).

versao: 1

# Categorias: "ente" (pessoa jurídica de direito público ou órgão que litiga em nome dele) ou "pj".
# dinheiro_publico: entra na medida "dinheiro público no recurso" da vista "Quanto vale" (a parte do
# acervo em que a União, a Fazenda Nacional, o INSS, um Estado ou o DF, ou um Município está como
# quem recorre ou quem responde: 22,4% do STJ em 20/11/2026, a conta do analista).
categorias:
  uniao:            {nome: "União", tipo: ente, dinheiro_publico: true}
  fazenda_nacional: {nome: "Fazenda Nacional", tipo: ente, dinheiro_publico: true}
  inss:             {nome: "INSS", tipo: ente, dinheiro_publico: true}
  estado:           {nome: "Estados e DF", tipo: ente, dinheiro_publico: true}
  municipio:        {nome: "Municípios", tipo: ente, dinheiro_publico: true}
  autarquia:        {nome: "Autarquias e fundações públicas", tipo: ente}
  mp:               {nome: "Ministério Público", tipo: ente}
  defensoria:       {nome: "Defensoria Pública", tipo: ente}
  legislativo:      {nome: "Poder Legislativo", tipo: ente}   # no STF, quem editou a lei questionada (ADI, ADPF)
  banco:            {nome: "Bancos e financeiras", tipo: pj}
  plano_saude:      {nome: "Planos de saúde", tipo: pj}
  seguradora:       {nome: "Seguradoras", tipo: pj}
  previdencia_privada: {nome: "Previdência complementar", tipo: pj}
  concessionaria:   {nome: "Energia, água e telefonia", tipo: pj}
  empresa:          {nome: "Outras empresas", tipo: pj}
  outro_ente:       {nome: "Outros entes públicos", tipo: ente}
  outra_pj:         {nome: "Outras pessoas jurídicas", tipo: pj}

# Classes que não entram em "quem se repete": nos precatórios (Prc, RPV, na Presidência) o
# requerente é o credor ou o cessionário (escritório de advocacia, fundo de precatórios).
fora_de_quem_se_repete_classes: [Prc, RPV]

