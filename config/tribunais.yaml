# ── Limiares (as réguas das contas) ──────────────────────────────────────────────────────────
limiares:
  mesa_dias: [180, 365]          # "sem decisão registrada há mais de" (o 365 é o "há mais de 1 ano"); escolha editorial
  idade_faixas_meses: [6, 12, 24, 36, 60]   # "Há quanto tempo": até 6 meses, 6–12, 1–2 anos, 2–3, 3–5, mais de 5
  comparacao:                    # "Em que ele está mais": só com os pares e só com teste
    confianca: 0.99              # binomial exata bicaudal + Holm sobre todas as comparações do tribunal
    razao: [0.80, 1.25]          # piso de efeito: marca só fora desta faixa...
    pontos: 2                    # ...e com 2 pontos percentuais ou mais de diferença
    minimo_area: 30              # processos da área no ministro ou nos pares para testar
    minimo_acervo: 1000          # acervo mínimo do ministro para entrar no teste ("poucos processos para comparar")
    pares: {stj: turma, stf: tribunal}   # STJ: a mesma Turma, sem ele; STF: o tribunal sem ele e sem a Presidência
  nao_comparavel_meses: 6        # herança recente, chegada à Turma ou convocação há menos que isto: selo, sem marca
  heranca_parte: 0.30            # "acervo herdado": atribuições de 30% ou mais do acervo nos últimos 6 meses
  nome_parte_tribunal: 20        # processos para um litigante (PJ ou ente) aparecer com nome na lista do tribunal
  nome_parte_ministro: 5         # ... no cartão do ministro
  achado_heranca: 300            # atribuições a um relator num dia para virar achado
  tema_quente_vezes: 2           # entrada de 30 dias de uma subárea × a mediana mensal dos 12 meses anteriores
  tema_quente_minimo: 50
  litigante_semana_vezes: 3      # entrada de 7 dias de um litigante × a média semanal das 12 semanas anteriores
  litigante_semana_minimo: 100
  vista_dias: 90                 # STF: vista vencida (RISTF, art. 134, com a ER 58/2022; conferir) — fase 2
  recusa_arquivo_menor_que: 0.85 # acervo do dia com total fora de [menor_que, maior_que] × o do último dia bom é
  recusa_arquivo_maior_que: 1.15 # recusado: fica o painel daquele dia (dados.py; a faixa é a da integração)
  recortes_por: principal        # principal (o assunto que decidiu a área) ou todos (qualquer assunto do processo)
  rampa: [0.02, 0.05, 0.10, 0.25]  # faixas da cor da célula da matriz: <2%, 2–4, 5–9, 10–24, 25% ou mais (designer)
  listas:                        # quantos itens cada lista leva (os tetos de tamanho dos JSON dependem disto)
    painel_mais_antigos: 5       # por ministro, no painel (a mesa compacta sem script)
    fila_mais_antigos: 30        # o tribunal inteiro, na aba "A fila"
    dossie_mais_antigos: 15      # no dossiê do ministro
    dossie_em_pauta: 20
    partes_tribunal: 30
    partes_ministro: 10
    partes_painel_ministro: 3
    subareas_painel: 5
    assuntos_por_area: 10
    partes_por_area: 5
  janelas:
    entradas_dias: 365           # "o que entrou": 12 meses...
    entradas_recentes_dias: 30   # ...e 30 dias
    decisoes_dias: 365           # "o que decidiu": 12 meses até o último arquivo publicado
  pesos_achados:                 # peso = base do tipo × log10(1 + n); a manchete é o de maior peso
    heranca: 5
    mesa_antiga: 4
    fora_do_padrao: 3
    litigante: 3
    tema: 3
    tema_quente: 2
    vista: 2
    entrou: 1

# ── Fontes (endereços e ritmo) ───────────────────────────────────────────────────────────────
# User-Agent: o do projeto (qijournal.net.USER_AGENT), que se identifica como robô e dá o endereço.
# Toda requisição passa pelo robots.txt do host (lido uma vez por dia; caminho vedado = o pedido não
# sai) e pela pausa mínima do host. 403 (o WAF Cloudflare do STJ recusa às vezes, por taxa): uma
# nova tentativa depois de recusa_espera_s; se repetir, a fonte vira aviso e fica o último dia bom.
fontes:
  robots_validade_h: 24
  pausa_s: 1.0                   # padrão para host não listado
  recusa_espera_s: 120
  hosts:
    dadosabertos.web.stj.jus.br: {pausa_s: 10}       # Crawl-Delay: 10 no robots.txt (lido em 23/11/2026)
    www.stf.jus.br: {pausa_s: 1}
    portal.stf.jus.br: {pausa_s: 1}
    jurisprudencia.stf.jus.br: {pausa_s: 1}
    www.cnj.jus.br: {pausa_s: 1}
    # O DataJud é um Elasticsearch puro: não tem robots.txt (o /robots.txt responde 401 sem a chave e 403
    # com ela, "robots.txt" lido como nome de índice; conferido em 23/11/2026). robots: api = 4xx no
    # robots.txt vale "sem regras" (RFC 9309, §2.3.1.3); as regras do host são as do termo de uso.
    api-publica.datajud.cnj.jus.br: {pausa_s: 0.5, recusa_espera_s: null, robots: api}   # 3.13 do termo: até 120/min; 403 ali é chave, não taxa
  # Nunca, nem que o robots.txt permita (prefixos de URL): a trava do coletor recusa antes de pedir.
  # O link para o leitor humano abrir o processo no tribunal é permitido (links_oficiais).
  proibidos:
    - "https://processo.stj.jus.br/"
    - "https://portal.stf.jus.br/processos"
    - "https://dadosabertos.web.stj.jus.br/api/"
  stj:
    portal: "https://dadosabertos.web.stj.jus.br"
    pagina_conjunto: "https://dadosabertos.web.stj.jus.br/dataset/{slug}"   # links: /dataset/<uuid>/resource/<uuid>/download/<arquivo>
    conjuntos:
      acervo: acervo-em-tramitacao                 # processos_tramitando_AAAAMMDD.json.gz (~82 MB; só o último dia fica publicado)
      atas: atas-de-distribuicao                   # ataAAAAMMDD.json (um por dia, ~22:30 UTC)
      pautas: pautas-futuras                       # pautas_futuras_AAAAMMDD.json.gz
      precedentes: precedentes-qualificados        # Temas.csv, Processos.csv
      integras: integras-de-decisoes-terminativas-e-acordaos-do-diario-da-justica   # metadadosAAAAMMDD.json (~38 dias de atraso em 22/11)
    validade_h: {acervo: 20, atas: 20, pautas: 20, precedentes: 20, integras: 20, pagina: 6}
    velho_dias: {acervo: 3, atas: 4, pautas: 4, precedentes: 8, integras: 45}
    atribuicao: "Fonte: STJ, Portal de Dados Abertos (CC-BY)"
    licenca: "CC-BY"
  stf:
    acervo: "https://www.stf.jus.br/arquivo/cms/publicacaoBOInternet/anexo/acervo/Acervo_STF_Lista_Geral.xlsx"
    atas_recupera: "https://portal.stf.jus.br/atadistribuicao/recuperaata.asp?dia={dia}&mes={mes}&ano={ano}"
    atas_lista: "https://portal.stf.jus.br/atadistribuicao/listaratas.asp?data={data}&num={num}&sessao={sessao}"
    jurisprudencia: "https://jurisprudencia.stf.jus.br/api/search/search"   # POST, consulta Elasticsearch; exigir _shards.failed == 0
    rg_temas: "https://portal.stf.jus.br/jurisprudenciaRepercussao/todostemas.asp"
    rg_exportar: "https://portal.stf.jus.br/jurisprudenciaRepercussao/exportarDados.asp"
    pauta: "https://portal.stf.jus.br/pauta/services/calendario-service.asp"
    validade_h: {acervo: 20, atas: 20, jurisprudencia: 20, rg: 160, pauta: 20}
    velho_dias: {acervo: 3, atas: 4, jurisprudencia: 10, rg: 10, pauta: 4}   # jurisprudência: a última data de julgamento indexada anda 4 a 6 dias atrás (18/11 em 23/11/2026)
    atribuicao: "Fonte: STF (portal, pesquisa de jurisprudência e acervo em www.stf.jus.br)"
  tpu:
    versao_soap: "https://www.cnj.jus.br/sgt/sgt_ws.php"   # getDataUltimaVersao (depreciado: o CNJ anuncia sgt.cloud.cnj.jus.br)
    dump: "https://www.cnj.jus.br/sgt/enviarArquivo.php?url={versao}_dump_dados_oracle_postgres.sql&nome=dump_dados_oracle_postgres.sql"
    versoes: "https://www.cnj.jus.br/sgt/versoes.php"
  # Endereço para o leitor humano abrir o processo no tribunal (não é coletado).
  links_oficiais:
    stj: "https://processo.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo={registro}"
    stf: "https://portal.stf.jus.br/processos/listarProcessos.asp?classe={classe}&numeroProcesso={numero}"
  # DJEN (comunicaapi.pje.jus.br): 403 geográfico (CloudFront) fora do Brasil. Não implementado; fase 2
  # só com um executor no Brasil, sem nada que mascare a origem.
  djen: {ativo: false}

# ── DataJud (CNJ, API Pública) ───────────────────────────────────────────────────────────────
# LIGADO PARA USO PESSOAL (decisão do dono, 23/11/2026: "não vou distribuir informação; é para uso
# pessoal"). O Termo de Uso da API (v1.2, lido em scratchpad/amostras/termos/datajud_termos_v1.2.txt):
#   3.3  "fornecida exclusivamente para fins legais, não comerciais e autorizados";
#   3.8  "não modificar, distribuir, vender ou explorar comercialmente a API ou qualquer informação
#        derivada dela" — o repositório e o site são públicos: o que entra em data/tribunais/ ou na
#        página é distribuído. Por isso publicar: false;
#   3.9  "dar ciência ao CNJ de qualquer informação [...] disponibilizado ao público em geral" —
#        publicar exige avisar o CNJ antes;
#   3.13 "não realizar mais de 120 requisições por minuto" — o teto do cliente (por_minuto).
# O serviço vive sobrecarregado (22 e 23/11/2026: 16 de 102 e 1 de 22 tentativas completas; em
# 23/11 de manhã, 0 de 25: 429 e 504). Nada dele está no caminho crítico: falha vira aviso.
# O que se pede: o frescor do índice, a conferência (ativos por gabinete × acervo do STJ) e os
# movimentos dos processos na mesa (o "concluso há N dias" do STJ; ver movimentos abaixo).
datajud:
  ativo: true
  # publicar: false (padrão) = o DataJud é consultado, o resultado fica só no cache (fora do git) e
  # nada derivado dele entra em data/tribunais/ nem na página; no meta.json a fonte sai "ligada para
  # uso pessoal; não publicada", sem número. true = a camada do CNJ vai aos painéis e à página, com
  # o selo "CNJ · DataJud" (só depois de dar ciência ao CNJ, item 3.9). A variável de ambiente
  # QIJ_DATAJUD_PUBLICAR=1 liga numa execução (a prévia privada), =0 desliga.
  publicar: false
  url: "https://api-publica.datajud.cnj.jus.br/api_publica_stj/_search"   # o STF não está no DataJud (404 index_not_found)
  chave: "cDZHYzlZa0JadVREZDJCendQbXY6SkJlTzNjLV9TRENyQk1RdnFKZGRQdw=="    # pública (wiki do CNJ); a variável DATAJUD_API_KEY a substitui
  chave_wiki: "https://datajud-wiki.cnj.jus.br/api-publica/acesso/"
  por_minuto: 120                # 3.13 (um pedido por vez: o tempo de cada um, de 1 a 60 s, já segura o ritmo)
  timeout_s: 90                  # acima dos 60 s do balanceador do CNJ: o 504 chega, não é cortado aqui
  tentativas: 3                  # frescor e conferência (agregações sobre o índice inteiro); os lotes têm as deles (movimentos)
  espera_s: [5, 15]              # × aleatório entre 1 − variacao e 1 + variacao; em 23/11 seis tentativas do frescor gastaram 5 min do prazo sem resposta
  variacao: 0.2
  disjuntor: 3                   # consultas seguidas sem resposta completa: DataJud parado nesta execução
  prazo_s: 900                   # teto do DataJud por execução; dados.py corta ao que sobra do passo (30 min) menos 5 min
  velho_dias: 15                 # o CNJ carrega o índice em lotes irregulares
  # Os movimentos dos processos na mesa do STJ: a data da última Conclusão (TPU 51, conferida na
  # tabela de movimentos do SGT: 14 Serventuário › 48 › 51, sem filhos; o tipo vai no complemento
  # tipo_de_conclusao), do último ato do magistrado (raiz 1 da TPU: decisão 3, julgamento 193,
  # despacho 11009), da última decisão ou julgamento e do último movimento. Régua da página:
  # "concluso há N dias (CNJ)" = a última conclusão veio depois do último ato do magistrado E não é
  # anterior à última distribuição ou decisão que o acervo do STJ registra (contas.camada_cnj).
  movimentos:
    ativo: true
    lote: 500                    # números CNJ por consulta (terms em numeroProcesso.keyword, _source filtrado)
    pagina: 1000                 # documentos por página do incremental (search_after)
    tentativas: 4                # por lote
    espera_s: [5, 15, 30]
    folga_s: 100                 # não começa lote novo com menos que isto de prazo
    incremental_fracao: 0.5      # parte do prazo do incremental enquanto a carga inicial não termina
    campo_incremental: dataHoraUltimaAtualizacao
    margem_h: 24                 # o incremental olha este tanto antes da marca (carga do índice fora de ordem)
    reconsultar_ausentes_dias: 7 # número que não estava no índice é pedido de novo depois disto
    cobertura_minima: 0.80       # faixa "conclusos há mais de 180/365 dias" do ministro só com 80% ou mais dos candidatos com data no CNJ

# ── DJEN: Diário de Justiça Eletrônico Nacional (CNJ) ────────────────────────────────────────
# Lido só por qijournal/tribunais/djen.py ("python -m qijournal tribunais djen"); o fontes.djen
# acima é o marcador antigo e não vale mais. Desde 29/11/2024 os atos judiciais do STJ saem no DJEN
# (Res. STJ/GP 19/2024; a página "Publicações Oficiais do STJ" aponta para
# comunica.pje.jus.br/consulta?siglaTribunal=STJ&meio=D). O STF tem DJe próprio (Res. STF 700/2020 e
# 725/2021) e, até onde se sabe, não publica no DJEN: a sonda confere e, sem publicação em
# sem_publicacao_dias dias úteis seguidos, o djen.json diz "publica: false".
# A API recusa (403 geográfico, CloudFront) quem está fora do Brasil: roda numa máquina do dono, no
# Brasil, pela tarefa agendada de scripts/djen/ (nunca no GitHub Actions, nunca por proxy ou VPN).
# A edição e a aba nunca dependem disto: sem djen.json novo, a aba sai sem a camada.
djen:
  ativo: true
  api: "https://comunicaapi.pje.jus.br/api/v1/comunicacao"
  consulta: "https://comunica.pje.jus.br/consulta"   # para o leitor (não é coletada)
  tribunais: [stj, stf]
  itens_por_pagina: 100          # o máximo que a API aceita
  pausa_s: 2                     # entre um pedido e o seguinte; o Crawl-delay do robots.txt vence se for maior
  max_paginas_dia: 150           # 15 mil publicações por tribunal e dia (o STJ publica ~3 mil decisões e acórdãos por dia útil)
  janela_dias: 30                # dias corridos até ontem
  dias_por_execucao: 5           # dias novos por execução (a janela enche em uma semana; --completo tira o teto)
  incluir_hoje: false            # o dia de hoje ainda recebe publicações: só entra fechado, no dia seguinte
  prazo_s: 2400                  # teto de uma execução (com o acervo refeito)
  guardar_dias: 40               # o cache da máquina guarda os dias por isto
  sem_publicacao_dias: 3         # dias úteis fechados sem nada: "o tribunal não publica no DJEN"
  origem: "coletado no Brasil, fora do GitHub Actions"   # vai no djen.json (público): sem cidade, sem nome
  atribuicao: "Fonte: CNJ, Diário de Justiça Eletrônico Nacional (DJEN)"
  # O casamento com o acervo (a "mesa"): o retrato que o fluxo dos Tribunais deixa no cache; sem ele,
  # o retrato é refeito uma vez por dia na máquina (o arquivo aberto do STJ, 82 MB, e a planilha do
  # STF, pelo mesmo coletor: robots.txt e 10 s entre pedidos ao portal do STJ).
  acervo: {baixar: true, retrato_validade_h: 30}
  listas: {mesa_por_ministro: 5, partes: 10, partes_ministro: 3, orgaos: 40, tipos_brutos: 30}
  sonda: {itens: 100, tentativas_dias: 3, amostra: 12}
  # O tipo de cada publicação: o primeiro grupo cujo padrão (texto sem acento, maiúsculo) aparece no
  # tipoDocumento; tipoDocumento genérico ("Intimação"): as três primeiras linhas do texto. Edital
  # também pelo tipoComunicacao. O resto é "outros" (e a contagem crua fica em cobertura.tipos_brutos,
  # para afinar esta lista depois da primeira coleta no Brasil).
  tipos:
    - {id: pauta, nome: "Pautas de julgamento", padroes: ["PAUTA", "SESSAO DE JULGAMENTO", "SESSAO VIRTUAL"]}
    - {id: distribuicao, nome: "Distribuição", padroes: ["DISTRIBUICAO"]}
    - {id: acordao, nome: "Acórdãos", padroes: ["ACORDAO", "EMENTA"]}
    - {id: decisao, nome: "Decisões", padroes: ["DECISAO", "SENTENCA", "MONOCRATICA"]}
    - {id: despacho, nome: "Despachos", padroes: ["DESPACHO", "ATO ORDINATORIO"]}
    - {id: edital, nome: "Editais", padroes: ["EDITAL"]}
