    texto: "#fff"
    raizes: [287, 1209, 11068, 11049, 9633]  # Penal, Processual Penal (no HC, a prisão é o mérito), militares, Criança e Adolescente
    nos: [9634, 10688]               # Ato infracional, Medidas socioeducativas
    classes: [HC, RHC, APn, AP, Inq, RvCr, RvC]  # STJ: APn e RvCr; STF: AP e RvC
  - id: outros
    nome: "Outros"
    nome_curto: "Outros"
    cor: ["#7b8494", "#8d95a3"]
    texto: "#0b0f17"
    raizes: [12467]                  # Questões de alta complexidade (Covid, Brumadinho...); e todo código fora das regras
    residual: true
  - id: sem_assunto
    nome: "Sem assunto"
    nome_curto: "Sem assunto"
    cor: null                        # hachura em --muted (designer.md §3)
    texto: null
    residual: true                   # a fonte não informou código válido

