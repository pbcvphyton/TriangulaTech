# ── Recortes transversais ────────────────────────────────────────────────────────────────────
# Não mudam a área: cada um tem a sua conta. Um processo entra no recorte quando o assunto que
# decidiu a área (o principal; ou o primeiro de mérito da lista, quando o principal é só processual)
# está sob um dos códigos: é a conta do analista (Bancário e crédito, 30.982 no STJ em 20/11/2026).
# Com limiares.recortes_por: todos, vale qualquer assunto do processo (Bancário: 33.483).
recortes:
  - {id: bancario, nome: "Bancário e crédito", codigos: [9607, 4960, 9582, 7717, 7752, 7772, 15048],
     porque: "os bancos são os litigantes privados que mais se repetem; atravessa Civil e Consumidor"}
  - {id: planos_saude, nome: "Planos de saúde", codigos: [12482, 7775], porque: "assunto de interesse público; Segunda Seção"}
  - {id: dano_moral, nome: "Dano moral", codigos: [10433, 7779, 9992], porque: "atravessa Civil, Consumidor e Administrativo"}
  - {id: execucao_fiscal, nome: "Execução fiscal", codigos: [6017, 10394], porque: "dinheiro público direto"}
  - {id: recuperacao_falencia, nome: "Recuperação judicial e falência", codigos: [4993], porque: "economia"}
  - {id: drogas, nome: "Drogas", codigos: [3607], porque: "a maior subárea penal"}
  - {id: improbidade, nome: "Improbidade", codigos: [10011], porque: "interesse político"}
