    cor: ["#de6a0b", "#d77b04"]
    texto: "#0b0f17"
    raizes: [899, 7724, 1146, 6191]  # Civil, Registros Públicos, Marítimo, Internacional (menos os nós listados em outras áreas)
  - id: familia
    nome: "Família e sucessões"
    nome_curto: "Família"
    cor: ["#ad67b8", "#b865b7"]
    texto: "#0b0f17"
    nos: [5626, 7673, 9964, 6216, 6214]  # Família, Sucessões, Infância (Seção Cível), alimentos e divórcio internacionais
  - id: empresarial
    nome: "Empresarial e falência"
    nome_curto: "Empresarial"
    cor: ["#864c0a", "#a95a03"]
    texto: "#fff"
    nos: [9616, 9981]                # Empresas (recuperação judicial e falência, sociedades, mercado de capitais); Pessoas Jurídicas
  - id: processual
    nome: "Só processual"
    nome_curto: "Só processual"
    cor: ["#7956d3", "#895bbb"]
    texto: "#fff"
    raizes: [8826]
    residual: true                   # só quando nenhum assunto da lista é de mérito
  - id: consumidor
    nome: "Consumidor"
