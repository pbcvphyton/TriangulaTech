# ── Composição ───────────────────────────────────────────────────────────────────────────────
# Quem é quem. STJ: o PDF oficial "Composição – 18/11/2026" (Assessoria para Assuntos Funcionais de
# Magistrados). STF: páginas "Composição Atual" (18/10/2025) e "Turmas" (06/08/2026) do portal,
# conferidas com o totalizador das atas de 19 e 20/11/2026 e com a lista da pesquisa de
# jurisprudência. Um teste quebra quando o acervo do dia traz relator fora deste mapa.
#
# Campos: id (<tribunal>-<slug>, endereço do dossiê), nome (como a página mostra), nome_completo,
# genero (f/m: "a ministra", "o ministro"), turma e secao (STJ: T1..T6, S1..S3; STF: T1, T2),
# corte_especial (STJ), cargos (presidente, vice_presidente, corregedor_cnj, presidente_turma,
# presidente_secao, decano), grade (false: fora da matriz e das médias — Presidência, Vice e
# Corregedoria não recebem distribuição comum), posse (no tribunal), turma_desde (ingresso no
# colegiado atual; menos de 6 meses = "não comparável"), convocado ({tribunal, vaga_de}: o
# desembargador convocado), gabinete (o texto oficial do local "na mesa"), aliases (como o nome
# aparece em cada fonte; a comparação ignora acento, caixa, "MIN.", "GABINETE DO MINISTRO" e o
# parêntese "(Desembargador Convocado do TJMG)"), codigo_ata (STF: cod_ministro das atas).
composicao:
  stj:
    data: "2026-11-18"
    fonte: "https://www.stj.jus.br/sites/portalp/SiteAssets/Paginas/Institucional/Composicao/Composicao-do-STJ.pdf"
    grupos:   # a matriz agrupa por Seção: no STJ, a Seção decide o ramo
