      - {id: pr, nome: "Sem Turma", descricao: "Presidência, Vice-Presidência e Corregedoria: fora das médias", turmas: []}
    orgaos: {T1: "Primeira Turma", T2: "Segunda Turma", T3: "Terceira Turma", T4: "Quarta Turma", T5: "Quinta Turma", T6: "Sexta Turma",
             S1: "Primeira Seção", S2: "Segunda Seção", S3: "Terceira Seção", CE: "Corte Especial"}
