# Analítico dos Tribunais (aba "Tribunais", edicoes/tribunais.html): as réguas das contas.
#
# Tudo o que está aqui é escolha editorial ou registro oficial copiado à mão, e vai escrito no
# "Como ler" da página (o meta.json leva uma cópia das réguas usadas em cada atualização).
# Lido por qijournal/tribunais/modelo.py (carregar_regras); chave desconhecida é ignorada,
# chave obrigatória ausente derruba a leitura com o caminho do erro.
#
# Seções: areas (macroáreas, cores e regras), subareas, recortes, composicao (quem é quem no STJ
# e no STF), limiares (as réguas das contas), fontes (endereços e ritmo), datajud (desligado).

versao: 1

# ── Macroáreas ───────────────────────────────────────────────────────────────────────────────
# Uma área por processo; as áreas somam 100% do acervo. A ordem desta lista é a ordem da legenda,
# das colunas da matriz ministro × área e das partes da "impressão digital" de cada gabinete.
#
# Como um processo cai numa área (o analista jurídico decide; a régua usa sempre o CÓDIGO da
# Tabela Processual Unificada do CNJ, nunca o texto do ramo, que vem fora do padrão nas fontes):
#   1. a CLASSE vale antes do assunto (classes: HC, RHC... → penal; ADI, ADC... → constitucional);
#   2. depois o NÓ MAIS ESPECÍFICO listado na árvore do assunto principal (nos: Família 5626 vence
#      a raiz Civil 899; Infância, Seção Cível 9964, vence a raiz da Criança e do Adolescente 9633);
#   3. depois a RAIZ da árvore (raizes);
#   4. assunto principal só processual (raiz 8826): vale o primeiro assunto de mérito da lista, na
#      ordem do tribunal; sem nenhum, a área é "Só processual", à mostra;
#   5. sem código válido: "Sem assunto". Código fora de toda regra: "Outros".
# Códigos com o prefixo 9 na lista do STJ ("910288") valem pelo código sem o 9 quando o código
# inteiro não existe na TPU. No STF os assuntos vêm em texto: o caminho é casado com a árvore da
# TPU pelo nome (ver tpu.py); sem casamento, vale o ramo do direito (a raiz) pelo nome.
#
# Cores: a paleta do designer (designer.md §3), as 13 cores dos temas do Congresso atribuídas por
# sentido, mais uma para Previdência (o designer juntava Trabalho e Previdência; o brief as separa).
# A 14ª cor (#874e87 / #a84d95, ameixa) foi escolhida por busca com o validador da skill dataviz
# (scratchpad/fundacao/cor14.mjs), entre Trabalho e Ambiental:
#   claro — CVD pior vizinha ΔE 11,7 (consumidor↔processual, protan; a nova: 13,7 com Trabalho),
#           visão normal pior vizinha 16,6 (administrativo↔tributário; a nova: 19,9), croma ≥ 0,10,
#           marca ≥ 3:1 contra #ffffff, #f8f9fb e #fffdf8 (a nova: 6,05 · 5,75 · 5,95), texto #fff 6,05:1;
#   escuro — CVD pior vizinha 11,2 (a nova com Trabalho, protan), normal 16,2, marca ≥ 3:1 contra
#           #111827, #131c2d e #262522 (a nova: 3,51 · 3,38 · 3,04), texto #fff 5,05:1.
# Só vizinhas foram testadas: a cor nunca vai sozinha (o nome da área vai sempre escrito).
# "cor": [claro, escuro]; "texto": a cor do texto sobre a área (a mesma nos dois modos).
areas:
  - id: constitucional
    nome: "Constitucional (controle concentrado)"
    nome_curto: "Constitucional"
    cor: ["#901557", "#b25874"]
    texto: "#fff"
    classes: [ADI, ADC, ADO, ADPF]   # só pela classe: o assunto da ação aparece como "sobre:"
  - id: tributario
    nome: "Tributário"
    nome_curto: "Tributário"
    cor: ["#a28a30", "#a3933f"]
    texto: "#0b0f17"
    raizes: [14]
  - id: administrativo
    nome: "Administrativo e servidores"
    nome_curto: "Administrativo"
    cor: ["#009896", "#08aaa8"]
    texto: "#0b0f17"
    raizes: [9985, 12775]            # Administrativo e outras matérias de direito público; Direito à Educação
    nos: [6197, 6192, 6202]          # Estrangeiro, Nacionalidade, Direitos humanos (sob Internacional)
  - id: saude
    nome: "Saúde"
    nome_curto: "Saúde"
    cor: ["#bd022f", "#d92141"]
    texto: "#fff"
    raizes: [12480]                  # Suplementar 12482 = planos; Pública 12481 = SUS
  - id: trabalho
    nome: "Trabalho"
    nome_curto: "Trabalho"
    cor: ["#176aea", "#0d77d6"]
    texto: "#fff"
    raizes: [864]                    # no STJ, só conflito de competência; no STF, o ARE vindo do TST
  - id: previdenciario
    nome: "Previdência e assistência"
    nome_curto: "Previdência"
    cor: ["#874e87", "#a84d95"]
    texto: "#fff"
    raizes: [195, 12734]
  - id: ambiental
    nome: "Ambiental"
    nome_curto: "Ambiental"
    cor: ["#298d41", "#40a763"]
    texto: "#0b0f17"
    raizes: [10110]                  # o crime ambiental (3618) fica em Penal
