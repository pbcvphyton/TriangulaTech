# Analítico do Congresso, à mão: lê por IA os projetos de lei novos (python -m qijournal
# congresso ler), baixa os dados abertos da Câmara e do Senado, refaz as contas e a aba
# Congresso (python -m qijournal congresso atualizar) e publica o que mudou em
# data/congresso/ (com as leituras, em data/congresso/leitura/) e edicoes/congresso.html.
#
# No dia a dia isto roda dentro da "Edição diária": a atualização antes da edição e a
# leitura dos projetos por último, com a edição já publicada. Este workflow serve
# para atualizar fora de hora ou refazer tudo ("carga completa": também os anos fechados
# da base de votos e todos os anos de proposições, baixados de novo).
name: Congresso

on:
  workflow_dispatch:
    inputs:
      completo:
        description: "Carga completa (refaz os anos fechados e relê todas as proposições)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  # A mesma fila da edição diária: nunca dois escritores na mesma branch.
  group: daily-edition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  congresso:
    runs-on: ubuntu-latest
    # A leitura dos projetos de lei novos (até 12 min; acessória) e a atualização.
    timeout-minutes: 57
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Dia do cache do Congresso
        id: cg
        run: echo "dia=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache do que foi baixado do Congresso
        # O mesmo cache da "Edição diária" (chave do dia; parte do mais recente). A carga
        # completa baixa tudo de novo de qualquer jeito e deixa o cache em dia.
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/congresso
          key: congresso-${{ steps.cg.outputs.dia }}
          restore-keys: congresso-

      - name: Ler os projetos novos
        # A leitura diária dos projetos de lei (a visão por parlamentar da aba Congresso): a
        # cadeia de IAs do jornal lê as proposições novas e as matérias que foram a voto e relê
        # o que muda a conta, antes da atualização, que já usa as leituras do dia. É acessório:
        # sem chave, com a IA fora do ar ou sem tempo, o que não foi lido fica para amanhã.
        # Limites em config/congresso.yaml (projeto_de_pais.leitura.diaria: 8 min de leitura,
        # mais a carga das proposições); o que for lido (data/congresso/leitura/) entra no
        # commit deste fluxo. Desligar: variável QIJ_NO_LEITURA=1.
        continue-on-error: true
        timeout-minutes: 12
        env:
          # Os mesmos editores por IA da edição (llm.providers), cada um com o seu segredo.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AIMLAPI_KEY: ${{ secrets.AIMLAPI_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QIJ_BRAND: ${{ vars.QIJ_BRAND }}
          QIJ_NO_CONGRESSO: ${{ vars.QIJ_NO_CONGRESSO }}
          QIJ_NO_LEITURA: ${{ vars.QIJ_NO_LEITURA }}
          QIJ_MODEL: ${{ vars.QIJ_MODEL }}
          QIJ_GEMINI_MODEL: ${{ vars.QIJ_GEMINI_MODEL }}
          QIJ_GEMINI_LITE_MODEL: ${{ vars.QIJ_GEMINI_LITE_MODEL }}
          QIJ_AIML_MODEL: ${{ vars.QIJ_AIML_MODEL }}
          QIJ_SENSENOVA_MODEL: ${{ vars.QIJ_SENSENOVA_MODEL }}
          QIJ_MISTRAL_MODEL: ${{ vars.QIJ_MISTRAL_MODEL }}
          QIJ_KIMI_MODEL: ${{ vars.QIJ_KIMI_MODEL }}
          TZ: America/Sao_Paulo
          PYTHONUNBUFFERED: "1"
        run: python -m qijournal congresso ler --dir . --cache "$RUNNER_TEMP/congresso"

      - name: Atualizar o Congresso
        env:
          QIJ_BRAND: ${{ vars.QIJ_BRAND }}
          QIJ_NO_CONGRESSO: ${{ vars.QIJ_NO_CONGRESSO }}
          INPUT_COMPLETO: ${{ inputs.completo }}
          TZ: America/Sao_Paulo
          PYTHONUNBUFFERED: "1"
        run: |
          args=(--dir . --cache "$RUNNER_TEMP/congresso")
          if [ "$INPUT_COMPLETO" = "true" ]; then args+=(--completo); fi
          python -m qijournal congresso atualizar "${args[@]}"

      - name: Publicar (commit e push)
        id: publish
        env:
          TZ: America/Sao_Paulo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage() {
            git add "$@" -- data/congresso edicoes/congresso.html
          }
          stage --all
          if git diff --cached --quiet; then
            echo "Nenhuma mudança para publicar."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit --quiet -m "🏛️ Congresso em $(date +%d/%m/%Y)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then break; fi
            echo "::notice::Push recusado (tentativa ${attempt}/3); refazendo o commit sobre o remoto."
            sleep $((attempt * 5))
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            git reset --quiet --mixed FETCH_HEAD
            stage --ignore-removal
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit --quiet -m "🏛️ Congresso em $(date +%d/%m/%Y)"
          done
          echo "::error::Não foi possível enviar os dados do Congresso após 3 tentativas."
          exit 1

      - name: Pedir build do GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
