# Testes automáticos e geração de uma edição de exemplo (sem rede, sem IA).
name: CI

on:
  push:
    paths-ignore:
      - "index.html"
      - "edicoes/**"
      - "data/**"
  pull_request:
    paths-ignore:
      - "index.html"
      - "edicoes/**"
      - "data/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Ubuntu 24.04 fixo: o ubuntu-latest passou a 26.04 (nov/2026) e o Playwright
    # 1.55.0 não instala o Chromium nele ("does not support chromium on ubuntu26.04").
    runs-on: ubuntu-24.04
    # A suíte levou 9 min 9 s em 17/11/2026 (de 10 min 50 s do job inteiro): 15 deixava pouca
    # folga para os testes da aba Tribunais (sem rede, com fixtures reais pequenas).
    timeout-minutes: 20
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Testes
        # --durations: os 15 testes mais lentos no fim do log, para ver quem come a folga.
        run: pytest --durations=15

      - name: Aba Tribunais de exemplo (offline)
        # Refaz a aba a partir de dados de exemplo no formato do contrato (tests/fixtures/tribunais/
        # fabrica.py: ministros, partes e números inventados, com as réguas reais do config), sem
        # rede: a página tem de sair e caber no teto de 1,5 MB (o dossiê de cada ministro é lido
        # sob demanda, fora da página). Liga-se sozinho quando o comando "tribunais" existir.
        run: |
          if [ ! -f qijournal/tribunais/cli.py ] || [ ! -f tests/fixtures/tribunais/fabrica.py ]; then
            echo "::notice::Sem o comando tribunais (qijournal/tribunais/cli.py) ou sem a fábrica de exemplo; passo pulado."
            exit 0
          fi
          dir="$RUNNER_TEMP/tribunais"
          python -c 'import sys; from pathlib import Path; from tests.fixtures.tribunais import fabrica; fabrica.gravar(Path(sys.argv[1]) / "data")' "$dir"
          python -m qijournal tribunais pagina --dir "$dir"
          page="$dir/edicoes/tribunais.html"
          test -s "$page" || { echo "::error::edicoes/tribunais.html não foi gerado"; exit 1; }
          size=$(wc -c < "$page")
          echo "tribunais.html do exemplo: $size bytes"
          [ "$size" -le 1500000 ] || { echo "::error::tribunais.html do exemplo com $size bytes (limite 1500000)"; exit 1; }

      - name: Edição de exemplo (offline)
        run: |
          out="$RUNNER_TEMP/out"
          python -m qijournal render --bundle tests/fixtures/bundle.json --out "$out" --no-llm
          date=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["date"])' "$out/edicoes/latest.json")
          for file in index.html "edicoes/$date.html" edicoes/index.html edicoes/latest.json \
                      edicoes/email.html edicoes/email.txt "data/$date.json"; do
            test -s "$out/$file" || { echo "::error::$file não foi gerado"; exit 1; }
          done
          ls -la "$out" "$out/edicoes" "$out/data"
          # A rotina do Gmail copia email.html no htmlBody: o do exemplo tem de ficar
          # com folga abaixo do limite de 40 KB (o real, com mais fontes, é maior).
          size=$(wc -c < "$out/edicoes/email.html")
          echo "email.html do exemplo: $size bytes"
          [ "$size" -le 36000 ] || { echo "::error::email.html do exemplo com $size bytes (limite 36000)"; exit 1; }

      - name: Instagram de exemplo (renderização real dos templates)
        run: |
          pip install -r requirements-instagram.txt
          python -m playwright install --with-deps chromium
          dir="$RUNNER_TEMP/ig"
          mkdir -p "$dir/edicoes" "$dir/data"
          # Edição por IA (fixture real de 20/10/2026), sem histórico em data/: manifesto (6), Em 1 minuto
          # (7: a fixture não tem o index, então sai sem o fechamento), stories (4), Número do dia (3) e Raio-X (8).
          cp tests/fixtures/edicao-2026-10-20.json "$dir/data/2026-10-20.json"
          echo '{"date": "2026-10-20"}' > "$dir/edicoes/latest.json"
          python -m qijournal instagram gerar --dir "$dir" --media-dir "$dir/midia" --now 2026-10-20T09:30:00Z --force 2>&1 | tee "$dir/log.txt"
          n=$(find "$dir/midia/2026-10-20" -name '*.jpg' | wc -l)
          echo "Imagens geradas: $n"
          [ "$n" -eq 28 ] || { echo "::error::esperava 28 imagens do Instagram (6 do manifesto + 22 do dia), saíram $n"; exit 1; }
          # Edição automática (sem IA) do exemplo offline: Terminal da manhã, stories, Número e Mercado em linha.
          auto=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["date"])' "$RUNNER_TEMP/out/edicoes/latest.json")
          python -m qijournal instagram gerar --dir "$RUNNER_TEMP/out" --media-dir "$dir/midia-auto" --now "${auto}T09:30:00Z" --force 2>&1 | tee -a "$dir/log.txt"
          [ -n "$(find "$dir/midia-auto" -name '*.jpg')" ] || { echo "::error::a edição automática não gerou imagens do Instagram"; exit 1; }
          if grep -q "fonte(s) não carregada" "$dir/log.txt"; then echo "::error::fonte da marca não carregou"; exit 1; fi
          # Texto cortado ou peça reprovada no lint (que caiu para o substituto) no exemplo é regressão de template.
          if grep -q "texto cortado\|reprovado no lint" "$dir/log.txt"; then echo "::error::peça do Instagram com texto cortado ou reprovada no lint"; exit 1; fi

      - name: Guardar as imagens do Instagram de exemplo
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: instagram-exemplo
          path: ${{ runner.temp }}/ig/midia*/
          retention-days: 7
          if-no-files-found: ignore

